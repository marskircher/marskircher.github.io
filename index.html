<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mars Kircher — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family: "Inter", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVIGATION */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;
      padding: 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .nav-links a {
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 0.45;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      padding: 150px 32px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-title {
      max-width: 1200px;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(64px, 12vw, 180px);
      font-weight: 500;
      line-height: 0.86;
      letter-spacing: -0.075em;
    }

    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 100px;
    }

    .hero-description {
      max-width: 420px;
      font-size: 16px;
      line-height: 1.45;
    }

    .scroll {
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* PROJECTS */

    .projects {
      padding: 120px 32px 160px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 70px;
      border-top: 1px solid #111;
      padding-top: 16px;
    }

    .section-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-number {
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
    }

    .project {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-bottom: 140px;
      align-items: end;
    }

    .project-image {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #eeeeee;
      overflow: hidden;
    }

    .project-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(.2,.7,.2,1);
    }

    .project:hover .project-image img {
      transform: scale(1.025);
    }

    .project-info {
      padding-bottom: 4px;
    }

    .project-type {
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .project-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(30px, 4vw, 58px);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 500;
      margin-bottom: 22px;
    }

    .project-description {
      max-width: 420px;
      font-size: 14px;
      line-height: 1.55;
      color: #444;
    }

    /* ABOUT */

    .about {
      border-top: 1px solid #111;
      padding: 24px 32px 160px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 32px;
    }

    .about-label {
      font-family: "Space Grotesk", sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
